name: Build FPS Optimizer APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d unzipped/
          cp -r unzipped/fps_optimizer/. .

      - name: Fix build files
        run: |
          # Pin Gradle to 8.4 (avoids 9.8 dep mutation bug)
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" \
            > gradle/wrapper/gradle-wrapper.properties

          # Fix app/build.gradle — remove viewBinding, add it back safely
          cat > app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.bench.fpsopt'
              compileSdk 34
              defaultConfig {
                  applicationId "com.bench.fpsopt"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildTypes {
                  debug { minifyEnabled false }
              }
          }
          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
              implementation 'dev.rikka.tools.refine:runtime:4.4.0'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          GRADLE

          # Fix MainActivity to not use ViewBinding
          cat > app/src/main/java/com/bench/fpsopt/MainActivity.kt << 'KT'
          package com.bench.fpsopt
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch
          import rikka.shizuku.Shizuku

          class MainActivity : AppCompatActivity() {
              private lateinit var statusText: TextView
              private lateinit var profileSpinner: Spinner
              private lateinit var profileInfo: TextView
              private lateinit var logView: TextView
              private var selectedProfile = 0

              private val permListener = Shizuku.OnRequestPermissionResultListener { _, result ->
                  if (result == PackageManager.PERMISSION_GRANTED) onPermissionGranted()
                  else toast("Shizuku permission denied")
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  statusText   = findViewById(R.id.statusText)
                  profileSpinner = findViewById(R.id.profileSpinner)
                  profileInfo  = findViewById(R.id.profileInfo)
                  logView      = findViewById(R.id.logView)
                  Shizuku.addRequestPermissionResultListener(permListener)
                  profileSpinner.adapter = ArrayAdapter(this,
                      android.R.layout.simple_spinner_dropdown_item,
                      Profiles.ALL.map { it.displayName })
                  profileSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: android.view.View?, pos: Int, id: Long) {
                          selectedProfile = pos
                          val pr = Profiles.ALL[pos]
                          profileInfo.text = "Target: ${pr.targetFpsLow}–${pr.targetFpsHigh} FPS | " +
                              "Density: ${if (pr.densityScale > 0) "${pr.densityScale}dpi" else "default"}"
                      }
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }
                  findViewById<android.widget.Button>(R.id.btnBoost).setOnClickListener { checkAndBoost() }
                  findViewById<android.widget.Button>(R.id.btnStop).setOnClickListener  { stopOptimizer() }
                  findViewById<android.widget.Button>(R.id.btnReset).setOnClickListener {
                      lifecycleScope.launch {
                          if (!ShizukuManager.isAvailable || !ShizukuManager.hasPermission) {
                              toast("Shizuku not ready"); return@launch
                          }
                          ShizukuManager.bindService()
                          logView.text = ProfileEngine.reset().joinToString("\n")
                      }
                  }
                  statusText.text = when {
                      !ShizukuManager.isAvailable   -> "⚠ Shizuku not running"
                      !ShizukuManager.hasPermission -> "⚠ Tap BOOST to grant permission"
                      else -> "✓ Shizuku ready"
                  }
              }

              private fun checkAndBoost() {
                  if (!ShizukuManager.isAvailable)   { toast("Start Shizuku first"); return }
                  if (!ShizukuManager.hasPermission) { ShizukuManager.requestPermission(42); return }
                  onPermissionGranted()
              }

              private fun onPermissionGranted() {
                  lifecycleScope.launch {
                      logView.text = "Binding Shizuku…"
                      val bound = ShizukuManager.bindService()
                      if (!bound) { toast("Failed to bind Shizuku"); return@launch }
                      val profile = Profiles.ALL[selectedProfile]
                      logView.text = "Applying: ${profile.displayName}…"
                      val log = ProfileEngine.apply(profile)
                      logView.text = log.joinToString("\n")
                      startForegroundService(
                          Intent(this@MainActivity, OptimizerService::class.java).apply {
                              action = OptimizerService.ACTION_START
                              putExtra(OptimizerService.EXTRA_PROFILE, selectedProfile)
                          }
                      )
                      toast("✓ ${profile.displayName} active")
                  }
              }

              private fun stopOptimizer() {
                  startService(Intent(this, OptimizerService::class.java).apply {
                      action = OptimizerService.ACTION_STOP
                  })
                  toast("Optimizer stopped")
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permListener)
                  super.onDestroy()
              }
          }
          KT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fps-optimizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
